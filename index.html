<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Triangulation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>Circle Triangulation</h1>

    <div class="input-group">
      <label for="address">Address or Location</label>
      <div class="address-row">
        <input type="text" id="address" placeholder="e.g. 1600 Pennsylvania Ave, Washington DC" />
        <button type="button" id="my-location-btn" class="icon-btn" title="Use my current location">&#x1F4CD;</button>
      </div>
    </div>

    <button id="pick-map-btn" class="btn btn-pick-map">&#x1F5FA; Pick on Map</button>

    <div class="input-row">
      <div class="input-group" style="flex:1">
        <label for="radius">Radius</label>
        <input type="number" id="radius" placeholder="e.g. 5.5" step="any" min="0" />
      </div>
      <div class="input-group" style="width:100px">
        <label for="unit">Unit</label>
        <select id="unit">
          <option value="km">km</option>
          <option value="mi">mi</option>
          <option value="m">m</option>
          <option value="ft">ft</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label for="circle-color">Color</label>
      <input type="color" id="circle-color" value="#3388ff" />
    </div>

    <button id="preview-btn" class="btn btn-preview">Preview Circle</button>
    <button id="accept-btn" class="btn btn-accept" disabled>Accept Circle</button>
    <button id="cancel-btn" class="btn btn-cancel" style="display:none">Cancel Preview</button>

    <div id="status" class="status"></div>

    <hr />

    <h2>Circles</h2>
    <div id="circle-list" class="circle-list">
      <p class="empty-msg">No circles yet.</p>
    </div>

    <hr />

    <h2>Intersections</h2>
    <button id="show-intersections-btn" class="btn btn-intersections" disabled>Show Intersections</button>
    <button id="clear-intersections-btn" class="btn btn-cancel" style="display:none">Clear Intersections</button>
    <div id="intersection-info" class="intersection-info"></div>
  </div>

  <div id="map"></div>

  <div id="delete-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>Delete Circle?</h3>
      <p id="delete-modal-text"></p>
      <div class="modal-buttons">
        <button id="delete-confirm" class="btn btn-delete">Yes, Delete</button>
        <button id="delete-cancel" class="btn btn-preview">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
