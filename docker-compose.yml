services:
  db:
    image: postgis/postgis:16-3.4
    container_name: circle-tri-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: circle_tri
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/data/osm:/osm-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d circle_tri"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
